name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Node.js version pin
        run: |
          test "$(grep -Ec '^(v)?[0-9]+\.[0-9]+\.[0-9]+$' .nvmrc)" -eq 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Standard verification
        run: ./scripts/verify.sh
