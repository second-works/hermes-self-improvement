name: Security

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  security-preflight:
    name: Security Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: candidate

      - name: Checkout pinned scanner
        uses: actions/checkout@v7
        with:
          repository: second-works/hermes-self-improvement
          ref: 1118cc6cb996e4eddbd0347b5131fb8b271e116d
          persist-credentials: false
          path: security-tool

      - name: Run trusted Security Preflight
        run: bash security-tool/scripts/security-preflight.sh candidate
