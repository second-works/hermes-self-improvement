name: Security

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  security-preflight:
    name: Trusted Security Inspection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      RUN_URL: https://github.com/second-works/hermes-self-improvement/actions/runs/${{ github.run_id }}

    steps:
      - name: Mark exact candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST "repos/second-works/hermes-self-improvement/statuses/$PR_HEAD_SHA" \
            -f state=pending -f context='Security Preflight' \
            -f description='Trusted base workflow is inspecting raw candidate blobs' -f target_url="$RUN_URL"

      - name: Checkout pinned scanner
        uses: actions/checkout@v7
        with:
          repository: second-works/hermes-self-improvement
          ref: ffc843ab1f880917922a9c4fa2ece7d730afbcc2
          persist-credentials: false
          path: security-tool

      - name: Fetch candidate objects without checkout
        run: |
          mkdir candidate
          git -C candidate init --quiet
          git -C candidate fetch --quiet --no-tags --depth=1 \
            https://github.com/second-works/hermes-self-improvement.git "$PR_HEAD_SHA"
          git -C candidate read-tree "$PR_HEAD_SHA"
          [[ "$BASE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C candidate fetch --quiet --no-tags --depth=1 \
            https://github.com/second-works/hermes-self-improvement.git "$BASE_WORKFLOW_SHA"

      - name: Run trusted Security Preflight
        id: scan
        run: |
          expected_paths="$(git -C security-tool ls-tree -r --name-only HEAD -- .github/workflows)"
          actual_paths="$(git -C candidate ls-tree -r --name-only "$PR_HEAD_SHA" -- .github/workflows)"
          if [[ "$actual_paths" != "$expected_paths" ]]; then
            echo 'SECURITY_STATUS=SECURITY_FAILED'
            echo 'SECURITY_REASON=workflow path set differs from approved pin'
            exit 1
          fi
          expected_security="$(git -C candidate ls-tree "$BASE_WORKFLOW_SHA" -- .github/workflows/security.yml)"
          actual_security="$(git -C candidate ls-tree "$PR_HEAD_SHA" -- .github/workflows/security.yml)"
          if [[ -z "$expected_security" || "$actual_security" != "$expected_security" ]]; then
            echo 'SECURITY_STATUS=SECURITY_FAILED'
            echo 'SECURITY_REASON=candidate Security definition differs from trusted base'
            exit 1
          fi
          for workflow in .github/workflows/ci.yml .github/workflows/codeql.yml; do
            expected_entry="$(git -C security-tool ls-tree HEAD -- "$workflow")"
            actual_entry="$(git -C candidate ls-tree "$PR_HEAD_SHA" -- "$workflow")"
            if [[ -z "$expected_entry" || "$actual_entry" != "$expected_entry" ]]; then
              echo 'SECURITY_STATUS=SECURITY_FAILED'
              echo "SECURITY_REASON=required workflow definition differs from approved pin: $workflow"
              exit 1
            fi
          done
          bash security-tool/scripts/security-preflight.sh candidate

      - name: Report exact candidate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          case "$SCAN_OUTCOME" in
            success) result=success ;;
            failure) result=failure ;;
            *) result=error ;;
          esac
          gh api --method POST "repos/second-works/hermes-self-improvement/statuses/$PR_HEAD_SHA" \
            -f state="$result" -f context='Security Preflight' \
            -f description='Trusted raw-blob inspection; unavailable and failed scans block merge' -f target_url="$RUN_URL"
